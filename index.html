<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonin Manager</title>
    <link rel="icon" type="image/x-icon" href="img/favico.png">

    <!-- Entrada do site: encaminha direto para o Manual da Marca.
         A autenticacao e feita pela plataforma da empresa. -->
    <meta http-equiv="refresh" content="0; url=manual.html">
    <link rel="canonical" href="manual.html">

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bonin-navy:  #161634;
            --bonin-blue:  #6BA8D7;
            --bonin-white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Sans Pro', Arial, sans-serif;
            background: radial-gradient(ellipse 125% 100% at 95% 75%, rgb(100 140 200 / .3) 0%, transparent 55%), radial-gradient(ellipse 90% 75% at 100% 100%, rgb(26 58 110 / .85) 0%, transparent 70%), linear-gradient(160deg, #04050c 0%, #060b17 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            color: rgba(255,255,255,0.7);
            text-align: center;
            padding: 1.5rem;
        }

        .logo { height: 48px; width: auto; }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--bonin-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        p { font-size: 0.875rem; }

        a {
            color: var(--bonin-blue);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<img
    src="https://bonin.eng.br/marca/img/BRAND%20KIT_Publico/02.%20Logo_PRINCIPAL_Azul%20PNG.png"
    alt="Bonin Engenharia"
    class="logo"
>

<div class="spinner"></div>

<p>Carregando o Manual da Marca...</p>

<a href="manual.html">Clique aqui se nao for redirecionado automaticamente</a>

<script>
    window.location.replace("manual.html");
</script>

</body>
</html>
